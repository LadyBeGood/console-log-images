<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rickroll</title>
</head>

<body>
    Open DevTools (F12). Only works in Chromium based browsers.

    <script type="module">
        const response = await fetch("./rickroll.gif");
        const blob = await response.blob();

        const reader = new FileReader();
        reader.onloadend = () => {
            const base64data = reader.result; // This is the full data:image/gif;base64,... string

            console.log("%c ", `
                background-image: url("${base64data}"); 
                background-repeat: no-repeat; 
                padding: 320px 500px;
            `);
        };
        reader.readAsDataURL(blob);
    </script>
</body>

</html>
